[project]
name = "python-cli-template"

version = "1.4.1"
description = "Repo for my copier templates"
dependencies = [
    "copier>=9.11.1",
    "jinja2-shell-extension>=2.1.1",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "commitizen>=4.18.0",
    "pre-commit>=4.6.2",
    "ruff>=0.16.4",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.4.1"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version"
]
pre_bump_hooks = [
    "uv lock"
]
